<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenfolio Network — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="NextZen navigation">
    <div class="side-logo">
      <span class="logo-mark">Z</span><span class="logo-word">NextZen</span>
    </div>
    <nav class="side-nav">
      <a href="#" class="side-item" data-stub="Dashboard" onclick="A.stub(event,'Dashboard')">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h5v-6h4v6h5V9.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span></a>
      <a href="#" class="side-item" data-stub="Photos" onclick="A.stub(event,'Photos')">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10.5" r="1.6" fill="currentColor"/><path d="m5 17 4.5-4 3.5 3 3-2.5L21 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Photos</span></a>
      <a href="#" class="side-item" data-stub="Website" onclick="A.stub(event,'Website')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.7 3.8 9S14.6 18.4 12 21c-2.6-2.6-3.8-5.7-3.8-9S9.4 5.6 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Website</span></a>
      <a href="#/bookme" class="side-item" data-page="bookme">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
        <span>BookMe</span></a>
      <a href="#/volume" class="side-item" data-page="volume">
        <svg viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m3.5 12.5 8.5 4.3 8.5-4.3M3.5 16.5 12 20.8l8.5-4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>Volume</span></a>
      <a href="#/home" class="side-item" data-page="network">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.4 7 15.5 8.6M7 8.3l3.6 7.4M16.8 10.3l-3.5 5.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
        <span>Network</span><span class="badge-new">New</span></a>
      <a href="#" class="side-item" data-stub="Settings" onclick="A.stub(event,'Settings')">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><circle cx="9" cy="7" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.7"/><circle cx="15" cy="12" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="17" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Settings</span></a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">Zenfolio&nbsp;&nbsp;›&nbsp;&nbsp;<strong>Network</strong></div>
      <div class="top-actions">
        <div class="bell-wrap" id="bell-wrap"></div>
        <div class="top-me" id="top-me"></div>
      </div>
    </header>
    <main id="outlet" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div class="demo-bar" id="demo-bar"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
